<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Registo de Categoria</title>
</head>
<body>
    <h1 th:text="${categoria.id != null} ? 'Editar Categoria' : 'Cadastrar Categoria'"></h1>

    <form th:object="${categoria}"
          th:action="${categoria.id != null} ? @{/categorias/{id}(id=${categoria.id})} : @{/categorias}"
          method="post">
        <div>
            <label>Nome da Categoria:</label>
            <input type="text" th:field="*{nome}" required />
        </div>
        <br />
        <div>
            <label>Descrição:</label>
            <input type="text" th:field="*{descricao}" required />
        </div>
        <br />
        <button type="submit" th:text="${categoria.id != null} ? 'Salvar Alterações' : 'Cadastrar Categoria'"></button>
        <a th:href="@{/categorias}">Cancelar</a>
    </form>
</body>
</html>
